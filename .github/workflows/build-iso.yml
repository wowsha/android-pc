name: Build Android-x86 ISO (Jelly Bean)

on:
  workflow_dispatch:
    inputs:
      target_product:
        description: Jelly Bean x86 target
        required: true
        default: android_x86
        type: string
  workflow_run:
    workflows:
      - Import Android-x86 Jelly Bean source
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-x86-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build ISO from checked-in Android-x86 source
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_X86_BRANCH: jb-x86
      TARGET_PRODUCT: ${{ github.event.inputs.target_product || 'android_x86' }}
      REPO_SYNC_JOBS: "2"
      BUILD_JOBS: "2"
      ARTIFACT_DIR: /workspace/dist

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Verify vendored Android-x86 source is present
        run: |
          test -f android-x86-source/build/core/root.mk
          test -d android-x86-source/frameworks/base
          test -d android-x86-source/kernel
          test -f manifests/remove-jb-x86-projects.xml
          find android-x86-source -type f | wc -l

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune --all --force || true
          df -h

      - name: Build legacy Ubuntu toolchain image
        run: |
          docker build \
            --pull \
            --file docker/android-x86-builder.Dockerfile \
            --tag android-x86-builder:jb \
            .

      - name: Build ISO using checked-in Android-x86 source
        run: |
          mkdir -p dist
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env HOME=/tmp/android-home \
            --env ANDROID_X86_BRANCH="${ANDROID_X86_BRANCH}" \
            --env TARGET_PRODUCT="${TARGET_PRODUCT}" \
            --env REPO_SYNC_JOBS="${REPO_SYNC_JOBS}" \
            --env BUILD_JOBS="${BUILD_JOBS}" \
            --env ARTIFACT_DIR="${ARTIFACT_DIR}" \
            android-x86-builder:jb \
            bash -lc 'mkdir -p "$HOME" && bash scripts/build-android-x86.sh'

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-x86-iso-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
